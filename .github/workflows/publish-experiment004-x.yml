name: Publish Experiment 004 results to X
on:
  push:
    branches: [main]
    paths:
      - 'social/experiment004-x-post.txt'
      - 'social/publish_experiment004_x.py'
      - '.github/workflows/publish-experiment004-x.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install publishing dependencies
        run: python -m pip install --disable-pip-version-check Pillow requests-oauthlib
      - name: Publish approved Experiment 004 research update and graphic
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python social/publish_experiment004_x.py
