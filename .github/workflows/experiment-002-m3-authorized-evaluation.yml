name: M3 authorized held-out scientific evaluation
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_M3_30_AUTHORIZED to execute all 30 frozen scenarios'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    if: ${{ inputs.confirmation == 'RUN_M3_30_AUTHORIZED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [3101,3102,3103,3104,3105,3106,3107,3108,3109,3110]
        window: [200,600,1200]
    container:
      image: ghcr.io/eclipse-sumo/sumo@sha256:b1298d1fd18244022db4da6498a2e842295c8014147ec78102270eaeb24449cb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: be2e8d27c78c8b6de4891115d6d951edc877ac6e
          path: frozen
      - name: Execute frozen scientific scenario and preserve native evidence
        run: |
          python3 experiments/experiment_002/m3_production_review/authorized_scenario_runner_v01.py \
            --seed ${{ matrix.seed }} --window ${{ matrix.window }} \
            --out "seed-${{ matrix.seed }}-window-${{ matrix.window }}" \
            --frozen frozen --authorized-evaluation
      - name: Create hashed scientific evidence manifest
        run: |
          python3 experiments/experiment_002/m3_production_review/authorized_scenario_manifest_v01.py \
            --root "seed-${{ matrix.seed }}-window-${{ matrix.window }}" \
            --seed ${{ matrix.seed }} --window ${{ matrix.window }}
      - name: Archive every attempted scenario, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-eval-seed-${{ matrix.seed }}-window-${{ matrix.window }}
          path: seed-${{ matrix.seed }}-window-${{ matrix.window }}/
          retention-days: 30
  aggregate:
    needs: evaluate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all available scenario artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: m3-eval-seed-*
          path: evidence
          merge-multiple: false
      - name: Require all 30 complete artifacts before scientific inference
        run: |
          python3 experiments/experiment_002/m3_production_review/authorized_aggregate_v01.py --root evidence --out final-results
      - name: Preserve consolidated results or diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-evaluation-consolidated-results
          path: final-results/
          retention-days: 30
