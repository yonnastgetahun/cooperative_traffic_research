# CI on PR only. No LinkedIn credentials, network access or publication.
name: LinkedIn publisher offline validation
on:
  pull_request:
    paths:
      - 'social/linkedin/**'
      - '.github/workflows/linkedin-manual-personal-document.yml'
      - '.github/workflows/linkedin-offline-validation.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax (no credentials)
        run: python3 -m py_compile social/linkedin/publish_linkedin.py social/linkedin/authorize_local.py
      - name: Check staged LinkedIn research caption offline
        run: python3 social/linkedin/publish_linkedin.py --action validate
      - name: Confirm publisher is manual-only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/linkedin-manual-personal-document.yml').read_text()
          assert 'workflow_dispatch:' in s
          assert '
  push:' not in s
          assert '
  pull_request:' not in s
          assert '
  schedule:' not in s
          print('PASS: manual-only publication workflow')
          PY
