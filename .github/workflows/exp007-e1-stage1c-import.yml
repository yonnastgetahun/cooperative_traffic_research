name: Stage 1C — one-time reviewed source import and no-SUMO scientific audit
on:
  pull_request:
    paths:
      - 'research/e1_stage1c_import_manifest.json'
      - '.github/workflows/exp007-e1-stage1c-import.yml'
permissions:
  contents: write
jobs:
  import-reviewed-implementation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Fetch exact SHA-pinned source package, reject mismatched bytes
        run: |
          python - <<'PY'
          import json
          m=json.load(open('research/e1_stage1c_import_manifest.json'))
          assert m['kind']=='E1_STAGE1C_SOURCE_IMPORT'
          assert m['sha256']=='959ca01b4ac08a328c97eae69ee9afd38d93abbf1590306bc9045cacc291139c'
          assert m['expected_files']==18 and m['no_sumo'] is True
          PY
          curl --fail --location --retry 2 --max-time 120 'https://at.adobe.com/9cg5gDVsVjQW21cU' -o /tmp/e1_stage1c_sources.zip
          echo '959ca01b4ac08a328c97eae69ee9afd38d93abbf1590306bc9045cacc291139c  /tmp/e1_stage1c_sources.zip' | sha256sum --check -
      - name: Safely extract only authored research source and implementation report
        run: |
          python - <<'PY'
          import zipfile,pathlib
          src=pathlib.Path('/tmp/e1_stage1c_sources.zip')
          with zipfile.ZipFile(src) as z:
              paths=z.namelist()
              assert len(paths)==18
              allowed='research/externality_estimator/'
              report='docs/POST_EXP007_E1_STAGE1C_IMPLEMENTATION_RECORD_2026-11-03.md'
              assert report in paths
              assert sum(x.startswith(allowed) for x in paths)==16
              assert '.github/workflows/exp007-e1-stage1c-no-sumo.yml' in paths
              for item in z.infolist():
                  p=pathlib.PurePosixPath(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  if item.filename.startswith(allowed) or item.filename==report:
                      assert not item.is_dir() and item.file_size<200000
                      dest=pathlib.Path(item.filename)
                      assert not dest.exists(),f'Refuse to overwrite original code {dest}'
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(z.read(item))
          print('Imported 16 code/source files + implementation report from pinned archive; no SUMO')
          PY
      - name: Run all 18 mandatory E1 scientific gates plus intake tests — no SUMO
        run: |
          python -m compileall -q research/externality_estimator
          python -m unittest discover -v research/externality_estimator/tests
          python - <<'PY'
          from research.externality_estimator.audit import enforce_no_oracle_imports
          enforce_no_oracle_imports('research/externality_estimator')
          print('PASS: prospective predictor imports no SUMO or offline label builder')
          PY
      - name: Commit verified source to this PR branch, no new simulation workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/externality_estimator/ docs/POST_EXP007_E1_STAGE1C_IMPLEMENTATION_RECORD_2026-11-03.md
          git diff --cached --stat
          git commit -m "research(exp007): implement E1 Stage1C prototype and pass 21 no-SUMO fixtures"
          git push origin HEAD:${{ github.head_ref }}
