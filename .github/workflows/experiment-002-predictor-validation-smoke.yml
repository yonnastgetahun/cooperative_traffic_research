name: Experiment 002 predictor validation smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-predictor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: ghcr.io/eclipse-sumo/sumo:latest
    env:
      SUMO_HOME: /usr/share/sumo
    steps:
      - uses: actions/checkout@v4
      - name: Generate fixed independent demand (development seed 2001)
        run: |
          set -eu
          mkdir -p results
          sumo --version > results/sumo-version.txt
          netgenerate --grid --grid.number 10 --grid.length 200 --output-file results/network.net.xml
          python3 - <<'PY'
          import os,sys,random,json,xml.etree.ElementTree as ET
          sys.path.insert(0,os.path.join(os.environ.get('SUMO_HOME','/usr/share/sumo'),'tools'))
          import sumolib
          seed=2001;window=200
          random.seed(seed)
          net=sumolib.net.readNet('results/network.net.xml')
          edges=[e for e in net.getEdges() if not e.isSpecial() and e.allows('passenger')]
          root=ET.Element('trips')
          for i in range(1000):
              for _ in range(1000):
                  a,b=random.sample(edges,2)
                  path,_=net.getShortestPath(a,b,vClass='passenger')
                  if path and len(path)>=2:break
              else:raise RuntimeError('No valid OD')
              ET.SubElement(root,'trip',id=f'veh{i:04d}',depart=f'{i*window/1000:.3f}',**{'from':a.getID(),'to':b.getID()})
          ET.ElementTree(root).write('results/trips.xml',encoding='utf-8',xml_declaration=True)
          json.dump({'window':window,'seed':seed,'purpose':'instrumentation smoke, not held-out evaluation','vehicles':1000},open('results/manifest.json','w'),indent=2)
          PY
          sha256sum results/network.net.xml results/trips.xml > results/input-hashes.txt
      - name: Generate routes and frozen forecasts
        run: |
          set -eu
          duarouter -n results/network.net.xml -r results/trips.xml -o results/independent.rou.xml --seed 2001 --no-step-log true
          python3 experiments/experiment_002/time_aware.py --net results/network.net.xml --trips results/trips.xml --out results/time-aware.rou.xml --audit results/time-aware-audit.csv --manifest results/time-aware-manifest.json
          python3 experiments/experiment_002/predictor_validation.py predict --net results/network.net.xml --routes results/time-aware.rou.xml
          sha256sum results/time-aware.rou.xml results/forecasts.csv results/forecast-occupancy.csv > results/forecast-hashes.txt
      - name: Observe simulation
        run: |
          set -eu
          sumo -n results/network.net.xml -r results/time-aware.rou.xml --fcd-output results/observed-fcd.xml --fcd-output.period 1 --tripinfo-output results/observed-tripinfo.xml --seed 2001 --no-step-log true
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          n=len(ET.parse('results/observed-tripinfo.xml').getroot().findall('tripinfo'))
          print('Completed trips:',n)
          if n!=1000:raise RuntimeError('Incomplete trips')
          PY
      - name: Compare forecasts with observations
        run: |
          python3 experiments/experiment_002/predictor_validation.py compare --fcd results/observed-fcd.xml
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp002-predictor-validation-smoke-window200-seed2001
          path: results/
          retention-days: 30
