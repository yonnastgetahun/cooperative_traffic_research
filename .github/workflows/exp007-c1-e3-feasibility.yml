name: C1 E3 controlled junction - archive-only feasibility gate (NO SUMO)
on:
  pull_request:
    paths:
      - 'research/c1_e3/**'
      - '.github/workflows/exp007-c1-e3-feasibility.yml'
permissions:
  contents: read
  actions: read
jobs:
  C0_C1_source_and_network_fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: ghcr.io/eclipse-sumo/sumo@sha256:b1298d1fd18244022db4da6498a2e842295c8014147ec78102270eaeb24449cb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 41966516110
          github-token: ${{ github.token }}
          name: exp007-e1v2-d1-original-frozen-60arm-evidence
          path: original
      - uses: actions/download-artifact@v4
        with:
          run-id: 41969929377
          github-token: ${{ github.token }}
          name: exp007-e1v2-d1-no-go-audit-manifests
          path: ledger
      - uses: actions/download-artifact@v4
        with:
          run-id: 42113107379
          github-token: ${{ github.token }}
          name: e1v2-fourarm-original-replays
          path: replays
      - name: Read-only source mapping and SUMO 1.28 netconvert E3-only priority feasibility (no SUMO)
        run: |
          python3 -m pip install --disable-pip-version-check 'lxml==6.0.2'
          python3 -m py_compile research/c1_e3/feasibility.py
          python3 -m research.c1_e3.feasibility --root original --replays replays --ledger ledger/SHA256_PER_MEMBER.csv --lock research/c1_e3/C1_FROZEN_INTERVENTION_LOCK.json --out feasibility
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp007-c1-e3-C0-C1-frozen-feasibility
          path: feasibility/
          if-no-files-found: warn
          retention-days: 30
