name: Publish research update to X

on:
  push:
    branches: [main]
    paths: ['social/x-update-2026-10-26.txt']
  workflow_dispatch:
    inputs:
      post_text:
        description: "Approved X post text (leave blank for M3 held-out findings with graphic)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image and OAuth dependencies
        run: python -m pip install --disable-pip-version-check Pillow requests-oauthlib
      - name: Publish M3 result graphic and approved update
        env:
          POST_TEXT: ${{ inputs.post_text }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python social/publish_m3_x.py
