name: Experiment 002 G3 R3-R4 - archive passed pre-freeze development evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - experiments/experiment_002/g3_r3r4_archive_trigger_2026_10_26.txt
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 40459207060
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          name: exp002-G3-R3-three-regime-development-summary
          path: r3-summary
      - uses: actions/download-artifact@v4
        with:
          run-id: 40459207060
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          name: exp002-G3-R4-seed-level-development-dryrun
          path: r4-dryrun
      - uses: actions/download-artifact@v4
        with:
          run-id: 40459207060
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pattern: exp002-R3-exception-audit-window-*
          path: r3-per-regime
          merge-multiple: false
      - name: Verify R3 and R4 source gate evidence before publishing
        run: |
          python3 - <<'PY'
          import json,csv,pathlib
          j=lambda p:json.loads(pathlib.Path(p).read_text())
          r3=j('r3-summary/r3-integrity.json')
          r4=j('r4-dryrun/r4-analysis-dryrun.json')
          assert r3['scenario_count']==3 and r3['development_seed']==2101
          assert r3['teleports_zero_confirmed_all_regimes']
          assert not r3['exception_open_regimes'] and not r3['heldout_evaluated']
          assert r4['data_integrity']['passed'] and r4['data_integrity']['no_reserved_evaluation_seed_access']
          assert r4['development_seed_list']==[2101,2102,2103]
          for w in [200,600,1200]:
              root=pathlib.Path('r3-per-regime')/f'exp002-R3-exception-audit-window-{w}-seed2101'
              a=j(root/'r3-exceptions.json')
              b=j(root/'simulation-invariance.json')
              assert a['seed']==2101 and a['window_seconds']==w
              assert a['reported_teleports']['teleport_state']=='ZERO_CONFIRMED'
              assert a['reported_teleports']['teleports_total']==0
              assert a['exception_gate']=='PASS_FOR_THIS_REPLAY'
              assert a['tripinfo_invariant'] and b['status']=='PASS'
              assert (root/'statistics.xml').is_file() and (root/'source-hashes.txt').is_file()
          print('R3 and R4 source integrity validated; not M3 freeze.')
          PY
      - name: Commit compact reproducible R3 and R4 evidence
        run: |
          set -eu
          D=docs/results/exp002_g3_r3_r4_2026_10_26
          mkdir -p "$D"
          cp r3-summary/*.md r3-summary/*.csv r3-summary/*.json "$D/"
          cp r4-dryrun/*.md r4-dryrun/*.csv r4-dryrun/*.json r4-dryrun/input-hash.txt "$D/"
          for w in 200 600 1200; do
            SRC="r3-per-regime/exp002-R3-exception-audit-window-$w-seed2101"
            DEST="$D/window-$w-seed2101"
            mkdir -p "$DEST"
            cp "$SRC/r3-exceptions.json" "$SRC/simulation-invariance.json" "$DEST/"
            cp "$SRC/statistics.xml" "$SRC/collisions.xml" "$SRC/sumo.log" "$DEST/"
            cp "$SRC/source-hashes.txt" "$SRC/observation-hashes.txt" "$DEST/"
            cp "$SRC/sumo-version.txt" "$SRC/sumo-image-digest.txt" "$DEST/"
          done
          cat > "$D/README.md" <<'MD'
          # Experiment 002 — R3 and R4 Pre-Freeze Development Evidence

          **R3 exceptional-event policy applied and checked. R4 statistical method dry run passed. M3 is NOT frozen and held-out evaluation is NOT authorized.**

          - [R3 exceptional-event findings](R3_DEVELOPMENT_EXCEPTION_REPORT.md) and [three-regime CSV](r3-regime-exception-summary.csv)
          - [R4 paired seed analysis dry run](R4_DEVELOPMENT_ANALYSIS.md), [per-seed CSV](r4-development-per-seed.csv), [seed-level summary CSV](r4-development-seed-summary.csv)
          - [R3 machine-readable integrity](r3-integrity.json) and [R4 analysis specification](r4-analysis-dryrun.json)
          - Each window folder has explicit native teleport statistics, collision output, SUMO log, exception classifications, tripinfo invariance and SHA256 hashes.
          - [Executed source workflow and full temporary artifacts](https://github.com/yonnastgetahun/cooperative_traffic_research/actions/runs/40459207060#artifacts)

          These are prior *development* seeds only (R3: 2101, R4: 2101–2103). No data from reserved seeds 3101–3110 have been accessed. A recorded zero SUMO teleport count applies only to the strictly matched recorded development replays. Blank or absent native speed/occupancy fields are not zero; partial edge bins are reported by coverage status. The analysis is not evidence of a calibrated predictor, improved routing, or real-world safety.

          Source policies: [R3 exceptional event contract](../../EXPERIMENT_002_R3_EXCEPTION_AND_MISSINGNESS_CONTRACT_V0_1.md), [R4 seed-level analysis plan](../../EXPERIMENT_002_R4_SEED_LEVEL_ANALYSIS_AND_REPRODUCIBILITY_V0_1.md).
          MD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$D"
          git diff --cached --quiet && exit 0
          git commit -m 'Archive R3 teleport and native missingness integrity with R4 development seed analysis'
          git push origin HEAD:main
