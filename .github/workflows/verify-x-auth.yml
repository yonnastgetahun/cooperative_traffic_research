name: Verify X authentication (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify credentials without publishing
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python - <<'PY'
          import os, sys, json, time, secrets, base64, hmac, hashlib
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          names = ("X_API_KEY", "X_API_SECRET", "X_ACCESS_TOKEN", "X_ACCESS_TOKEN_SECRET")
          missing = [n for n in names if not os.getenv(n)]
          if missing:
              print("Missing GitHub Actions secrets: " + ", ".join(missing))
              sys.exit(1)

          url = "https://api.x.com/1.1/account/verify_credentials.json"
          method = "GET"
          oauth = {
              "oauth_consumer_key": os.environ["X_API_KEY"],
              "oauth_nonce": secrets.token_hex(16),
              "oauth_signature_method": "HMAC-SHA1",
              "oauth_timestamp": str(int(time.time())),
              "oauth_token": os.environ["X_ACCESS_TOKEN"],
              "oauth_version": "1.0",
          }
          enc = lambda x: quote(str(x), safe="~-._")
          params = "&".join(f"{enc(k)}={enc(v)}" for k,v in sorted(oauth.items()))
          base = "&".join(map(enc, (method, url, params)))
          key = enc(os.environ["X_API_SECRET"]) + "&" + enc(os.environ["X_ACCESS_TOKEN_SECRET"])
          sig = base64.b64encode(hmac.new(key.encode(), base.encode(), hashlib.sha1).digest()).decode()
          oauth["oauth_signature"] = sig
          header = "OAuth " + ", ".join(f'{enc(k)}="{enc(v)}"' for k,v in sorted(oauth.items()))
          try:
              with urlopen(Request(url, headers={"Authorization": header, "User-Agent": "cooperative-traffic-auth-check"}), timeout=20) as response:
                  result = json.load(response)
              print("Authenticated as @" + str(result.get("screen_name", "unknown")))
              print("Read-only authentication succeeded. No post was published.")
          except HTTPError as e:
              print(f"X authentication check returned HTTP {e.code}. Verify permissions, tokens, endpoint access, and API billing.")
              sys.exit(1)
          except URLError as e:
              print("Network error while contacting X.")
              sys.exit(1)
          PY
