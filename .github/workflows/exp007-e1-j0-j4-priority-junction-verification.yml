name: E1 J0-J4 pinned SUMO 1.28 junction source verification (no SUMO runs)

on:
  pull_request:
    paths:
      - 'research/audits/e1_sumo_priority_junction_j0_j4.py'
      - '.github/workflows/exp007-e1-j0-j4-priority-junction-verification.yml'
  push:
    branches: [main]
    paths:
      - 'research/audits/e1_sumo_priority_junction_j0_j4.py'
      - '.github/workflows/exp007-e1-j0-j4-priority-junction-verification.yml'

permissions:
  contents: write
  actions: read

jobs:
  verify-static-junction-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact SUMO 1.28.0 tagged source, sparse sumolib only
        uses: actions/checkout@v4
        with:
          repository: eclipse-sumo/sumo
          ref: daf91b5578901d599ac9af53f49d26eeb9aefc3b
          path: sumo-pinned
          sparse-checkout: |
            tools/sumolib
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Install streaming XML parser only; no simulator
        run: python3 -m pip install --disable-pip-version-check 'lxml==6.0.2'
      - name: Retrieve 706 original Stage1D member bytes without new simulations
        uses: actions/download-artifact@v4
        with:
          run-id: 41737336992
          github-token: ${{ github.token }}
          name: exp007-e1-stage1d-original-development-cohort
          path: evidence
      - name: Retrieve permanent per-member SHA256 ledger, without modifying source
        env:
          GH_${{ github.token }}: ${{ github.token }}
        run: |
          mkdir -p checksum
          gh release download exp007-e1-stage1d-development-2026-11-03 \
            --pattern SHA256_PER_MEMBER.csv --dir checksum
      - name: Independently map SUMO junction request indices and compare frozen E1
        run: |
          mkdir -p audit
          PYTHONPATH="$PWD/sumo-pinned/tools:$PWD" python3 research/audits/e1_sumo_priority_junction_j0_j4.py \
            --root evidence --ledger checksum/SHA256_PER_MEMBER.csv \
            --pinned-source sumo-pinned --out audit
      - name: Archive all machine-readable findings and any partial failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp007-e1-j0-j4-pinned-source-priority-junction-audit
          path: audit/
          retention-days: 30
      - name: Preserve validated static-rule evidence in durable research release
        if: github.event_name == 'push' && github.run_attempt == 1
        env:
          GH_${{ github.token }}: ${{ github.token }}
        run: |
          tag="exp007-e1-j0-j4-priority-junction-verification-2026-11-04"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Research release already exists; refusing overwrite."
            exit 1
          fi
          gh release create "$tag" audit/* \
            --title "E1 J0-J4 — SUMO 1.28.0 priority-junction rules vs frozen E1" \
            --notes "Read-only verified static lane-connection/request index mapping, pinned SUMO 1.28.0 sumolib cross-check, pairwise foe/response and E1 all-conflict comparison; no SUMO runs or model changes. Static non-foes do NOT guarantee simultaneous crossing or prove E1 Stage1D error attribution. Original E1 DEVELOPMENT NOT QUALIFIED and Test B NOT RUN. See docs/POST_EXP007_E1_J0_J4_PRIORITY_JUNCTION_VERIFICATION_FINAL_REPORT_2026-11-04.md."
          gh release view "$tag" --json url,assets
