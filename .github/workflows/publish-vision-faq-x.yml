name: Publish approved Vision and FAQ announcement to X
on:
  pull_request:
    paths:
      - "social/vision-faq-x-2026-11-02.txt"
      - "social/publish_vision_faq_x.py"
      - ".github/workflows/publish-vision-faq-x.yml"
  push:
    branches: [main]
    paths:
      - "social/vision-faq-x-2026-11-02.txt"
      - "social/publish_vision_faq_x.py"
      - ".github/workflows/publish-vision-faq-x.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check requests requests-oauthlib
      - name: Verify approved caption and image SHA256
        run: |
          python - <<'PY'
          from social.publish_vision_faq_x import approved_caption, verified_image
          print("Caption length:",len(approved_caption()))
          print("Verified image bytes:",len(verified_image()))
          PY
  publish:
    needs: validate
    if: github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check requests requests-oauthlib
      - name: Publish only after approved image upload
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python social/publish_vision_faq_x.py
