name: Publish Experiment 003–006 four-image research update to X
on:
  pull_request:
    paths:
      - "social/experiment005006-x-post.txt"
      - "social/publish_experiment005006_x.py"
      - ".github/workflows/publish-exp005006-x.yml"
  push:
    branches: [main]
    paths:
      - "social/experiment005006-x-post.txt"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install asset-validation dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow requests-oauthlib
      - name: Verify all four PNGs before allowing publication
        run: |
          python3 - <<'PY'
          import ast,pathlib
          from social.publish_experiment005006_x import fetch_images
          text=pathlib.Path("social/experiment005006-x-post.txt").read_text().strip()
          assert 1<=len(text)<=280
          assert "RESEARCH_UPDATE_EXPERIMENTS_003_TO_006.md" in text
          assert len(fetch_images())==4
          print("PASS: 4 verified image assets and one approved landing link")
          PY
  publish:
    needs: validate
    if: github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X uploader dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow requests-oauthlib
      - name: Publish ONLY after all four media IDs have been obtained
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python3 social/publish_experiment005006_x.py
