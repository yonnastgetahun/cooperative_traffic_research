name: E1 Stage 1D development-only frozen cohort and calibration

on:
  pull_request:
    paths:
      - 'research/e1_development/stage1d_driver.py'
      - '.github/workflows/exp007-e1-stage1d-development.yml'
  push:
    branches: [main]
    paths:
      - 'research/e1_development/stage1d_driver.py'
      - '.github/workflows/exp007-e1-stage1d-development.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    container:
      image: ghcr.io/eclipse-sumo/sumo@sha256:b1298d1fd18244022db4da6498a2e842295c8014147ec78102270eaeb24449cb
    steps:
      - uses: actions/checkout@v4
      - name: Checkout unchanged original demand generator
        uses: actions/checkout@v4
        with:
          ref: be2e8d27c78c8b6de4891115d6d951edc877ac6e
          path: scientific
      - name: Frozen Stage 1B model integrity and 1000-driver A* scaling regression
        run: |
          python3 -m unittest discover -q research/externality_estimator/tests
          python3 -m py_compile research/e1_development/stage1d_driver.py
      - name: Generate all six DEV_BUILD source/route/probe manifests without SUMO simulation
        run: |
          python3 research/e1_development/stage1d_driver.py preflight --scientific scientific --out preflight
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp007-e1-stage1d-no-sumo-devbuild-preflight
          path: preflight/
          retention-days: 30

  frozen-development:
    if: github.event_name == 'push' && github.run_attempt == 1
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/eclipse-sumo/sumo@sha256:b1298d1fd18244022db4da6498a2e842295c8014147ec78102270eaeb24449cb
    steps:
      - uses: actions/checkout@v4
      - name: Checkout unchanged frozen demand generator
        uses: actions/checkout@v4
        with:
          ref: be2e8d27c78c8b6de4891115d6d951edc877ac6e
          path: scientific
      - name: Freeze DEV_BUILD predictions before 36 SUMO arms, select q_sat only from build; then freeze DEV_CHECK predictions before 24 additional arms
        run: |
          python3 research/e1_development/stage1d_driver.py develop --scientific scientific --out development
      - name: Preserve all source route manifests, immutable predictions, original labels, calibration and verdict including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp007-e1-stage1d-original-development-cohort
          path: development/
          retention-days: 30
