name: M3 supervisor full frozen development rehearsal (seed 2101 only)
on:
  pull_request:
    paths:
      - '.github/workflows/experiment-002-m3-supervisor-full-development.yml'
      - 'experiments/experiment_002/m3_production_review/development_attempt_supervisor_v01.py'
      - 'experiments/experiment_002/m3_production_review/test_development_attempt_supervisor_v01.py'
permissions:
  contents: read
  actions: read
jobs:
  supervised-development:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        window: [200, 600, 1200]
    container:
      image: ghcr.io/eclipse-sumo/sumo@sha256:b1298d1fd18244022db4da6498a2e842295c8014147ec78102270eaeb24449cb
    env:
      SUMO_HOME: /usr/share/sumo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: be2e8d27c78c8b6de4891115d6d951edc877ac6e
          path: frozen
      - name: Retrieve previously inspected development inputs only
        uses: actions/download-artifact@v4
        with:
          run-id: 40446073958
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          name: exp002-occupancy-M2-window-${{ matrix.window }}-seed2101
          path: source
      - name: Run frozen full simulation through development supervisor
        run: |
          python3 experiments/experiment_002/m3_production_review/development_attempt_supervisor_v01.py \
            --seed 2101 --window ${{ matrix.window }} \
            --frozen-root frozen --source source \
            --out supervised-attempt
      - name: Independently repeat frozen R3/R4 postprocessing on preserved output
        run: |
          python3 experiments/experiment_002/m3_production_review/development_postprocess_v01.py \
            --source supervised-attempt/results --out supervised-attempt/postprocess \
            --frozen frozen --seed 2101 --window ${{ matrix.window }}
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path("supervised-attempt")
          a=json.loads((p/"attempt.json").read_text())
          b=json.loads((p/"postprocess/postprocess-integrity.json").read_text())
          assert a["status"]=="COMPLETE" and a["heldout_authorized"] is False
          assert b["status"]=="DEVELOPMENT_POSTPROCESS_REPRODUCED_FROZEN_REFERENCE"
          assert b["heldout_authorized"] is False
          PY
      - name: Preserve complete attempt and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-supervised-development-window-${{ matrix.window }}-seed2101
          path: |
            supervised-attempt/
            results/
          retention-days: 30
