name: Experiment 004 archived network-outcome audit
on:
  pull_request:
    paths:
      - 'experiments/experiment_004/audit_archived_network_outcomes_v01.py'
      - '.github/workflows/experiment-004-archived-outcome-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 41023721390
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pattern: exp004-seed-*
          path: evidence
          merge-multiple: false
      - name: Normalize 120 archived scenario paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("evidence")
          for seed in range(3301,3311):
            for window in (200,600,1200):
              for arm in "ABCD":
                old=root/f"exp004-seed-{seed}-window-{window}-arm-{arm}"
                assert old.is_dir(),str(old)
                old.rename(root/f"seed-{seed}-window-{window}-arm-{arm}")
          PY
      - name: Audit archived network outcomes without simulations
        run: |
          mkdir -p results
          python3 experiments/experiment_004/audit_archived_network_outcomes_v01.py \
            --root evidence --out results/exp004-archived-outcome-audit.json
      - name: Preserve audit and diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp004-archived-network-outcome-audit
          path: results/
          retention-days: 30
