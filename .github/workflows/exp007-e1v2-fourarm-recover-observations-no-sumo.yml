name: E1-v2 four-arm archived trajectory analysis recovery (NO SUMO)
on:
  pull_request:
    paths:
      - 'research/replay/e1v2_four_arm_instrumented.py'
      - '.github/workflows/exp007-e1v2-fourarm-passive-instrumented.yml'
      - '.github/workflows/exp007-e1v2-fourarm-recover-observations-no-sumo.yml'
  push:
    branches: [main]
    paths:
      - 'research/replay/e1v2_four_arm_instrumented.py'
      - '.github/workflows/exp007-e1v2-fourarm-passive-instrumented.yml'
      - '.github/workflows/exp007-e1v2-fourarm-recover-observations-no-sumo.yml'
permissions:
  contents: write
  actions: read
jobs:
  archive_only_recovered_analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Download unchanged original 60-arm E1-v2 D1 source observations
        uses: actions/download-artifact@v4
        with:
          run-id: 41966516110
          github-token: ${{ github.token }}
          name: exp007-e1v2-d1-original-frozen-60arm-evidence
          path: original
      - name: Download exactly the FOUR previously completed G2-equivalent passive replays
        uses: actions/download-artifact@v4
        with:
          run-id: 42113107379
          github-token: ${{ github.token }}
          name: e1v2-fourarm-original-replays
          path: replays
      - name: Analyze raw trajectory, traffic and matched-driver evidence WITHOUT SUMO
        run: |
          python3 -m py_compile research/replay/e1v2_four_arm_instrumented.py
          python3 research/replay/e1v2_four_arm_instrumented.py aggregate --root original --replays replays --out findings
          test -s findings/FINAL_SCIENTIFIC_REPORT.md
          test -s findings/scientific_summary.json
          cat findings/FINAL_SCIENTIFIC_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve recovered scientific findings even for integrity failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1v2-fourarm-original-passive-replay-recovered-scientific-audit
          path: findings/
          retention-days: 30
          if-no-files-found: warn
      - name: Package four original replay archives and the independent summary with original-member hashes
        if: github.event_name == 'push' && github.run_attempt == 1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv,hashlib,zipfile
          source=Path('replays');dst=Path('release');dst.mkdir()
          rows=[]
          choices=((6112,'I'),(6112,'probe2'),(6113,'I'),(6113,'probe2'))
          for seed,arm in choices:
              directory=source/('replay-%s-%s'%(seed,arm))
              files=sorted(p for p in directory.iterdir() if p.is_file())
              assert files and len(files)>=11
              fn='e1v2-fourarm-original-%s-%s.zip'%(seed,arm)
              with zipfile.ZipFile(dst/fn,'w',zipfile.ZIP_DEFLATED,compresslevel=3) as z:
                  for p in files:
                      data=p.read_bytes()
                      rows.append(dict(archive=fn,member=p.name,bytes=len(data),
                                       sha256=hashlib.sha256(data).hexdigest()))
                      z.writestr(p.name,data)
              with zipfile.ZipFile(dst/fn) as z:
                  for r in rows:
                      if r['archive']==fn:
                          assert hashlib.sha256(z.read(r['member'])).hexdigest()==r['sha256']
          fn='e1v2-fourarm-scientific-audit.zip'
          with zipfile.ZipFile(dst/fn,'w',zipfile.ZIP_DEFLATED,compresslevel=3) as z:
              for p in sorted(Path('findings').glob('*')):
                  if not p.is_file():continue
                  data=p.read_bytes()
                  rows.append(dict(archive=fn,member=p.name,bytes=len(data),
                                   sha256=hashlib.sha256(data).hexdigest()))
                  z.writestr(p.name,data)
          with (dst/'SHA256_PER_MEMBER.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['archive','member','bytes','sha256'])
              w.writeheader();w.writerows(rows)
          with (dst/'SHA256_RELEASE_ASSETS.txt').open('w') as f:
              for p in sorted(dst.glob('*.zip')):
                  f.write(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          assert len({x['archive'] for x in rows})==5
          print('PASS: Four original raw passive replay ZIPs and one scientific ZIP SHA-verified,',len(rows),'members')
          PY
      - name: Preserve raw evidence permanently in an independent GitHub Release
        if: github.event_name == 'push' && github.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=exp007-e1v2-fourarm-passive-vehicle-replay-2026-11-05
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Already exists, no release overwrite or dataset mutation"
            exit 1
          fi
          gh release create "$tag" release/* --title "E1-v2 D1 four-arm passive vehicle replay: original source-preserving evidence" --notes "Four SUMO 1.28.0 historical development-arm passive replays were executed ONCE in Actions 42113107379, all G2 original-trip outcomes passed. Source-locked first 6112 I/probe2, 6113 I/probe2, no new seeds, E1 model edits, independent validation or cooperative Test B. A minor independent analysis NameError in original workflow was repaired in a no-SUMO archival-only recovery after original trajectories were preserved. Four raw FCD/vehroute/edge-lane ZIPs, an independent scientific audit ZIP and SHA256 member/asset ledgers. Explanatory study cannot uniquely prove causal junction mediation or validate E1-v2. Development NOT QUALIFIED remains."
          gh release view "$tag" --json url,assets
      - name: Publish compact derived findings onto a separately reviewable GitHub branch
        if: github.event_name == 'push' && github.run_attempt == 1
        run: |
          branch="science/e1v2-fourarm-results-$GITHUB_RUN_ID"
          mkdir -p docs/results/exp007_e1v2_fourarm_passive_2026_11_05
          cp findings/FINAL_SCIENTIFIC_REPORT.md docs/POST_EXP007_E1_V2_FOUR_ARM_PASSIVE_REPLAY_FINAL_SCIENTIFIC_REPORT_2026-11-05.md
          cp findings/*.csv findings/scientific_summary.json docs/results/exp007_e1v2_fourarm_passive_2026_11_05/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/POST_EXP007_E1_V2_FOUR_ARM_PASSIVE_REPLAY_FINAL_SCIENTIFIC_REPORT_2026-11-05.md docs/results/exp007_e1v2_fourarm_passive_2026_11_05/
          git commit -m "science: publish recovered E1-v2 4-arm vehicle-level observational results"
          git push origin "$branch"
