name: M3 solo operational amendment - offline tests only
on:
  pull_request:
    paths:
      - 'experiments/experiment_002/m3_production_review/solo_safeguards_v01.py'
      - 'experiments/experiment_002/m3_production_review/test_solo_safeguards_v01.py'
      - 'docs/EXPERIMENT_002_M3_SOLO_OPERATIONAL_SAFEGUARDS_AMENDMENT_V0_1.md'
permissions:
  contents: read
jobs:
  nonexecuting-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test fail-closed solo release rules (no simulation)
        run: python3 -m unittest discover -s experiments/experiment_002/m3_production_review -p 'test_solo_safeguards_v01.py' -v
