<text x="989" y="370" class="number">6/6</text>
<text x="991" y="411" class="body">Original outcomes reproduced</text>
<text x="991" y="445" class="body">Timing, waiting, and coupled</text>
<text x="991" y="476" class="body">traffic effects observed.</text>
<text x="72" y="572" style="font-size:25px;font-weight:800;fill:#f7fbff">THE NEXT SCIENTIFIC SEQUENCE</text>
