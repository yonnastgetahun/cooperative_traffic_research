<title id="title">Experiment 007: What we tested, discovered, and what comes next</title>
<desc id="desc">Cooperative Traffic Research milestone summary: Test A direction agreement 8 of 20 (40%) versus predeclared 60% gate; P0 through P3 found structural externality proxy limitation; six instrumented replay arms reproduced original trip outcomes exactly; next: build estimator, validate on unseen simulations, conduct Test B only on success.</desc>
