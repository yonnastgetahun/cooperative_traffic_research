<text x="99" y="369" class="number">8/20</text>
<text x="101" y="409" class="body">Correct predicted direction</text>
<text x="101" y="442" class="body">40% vs 60% required</text>
<text x="101" y="476" style="font-size:20px;font-weight:800;fill:#ffab89">NO-GO  •  TEST B STOPPED</text>
<rect x="516" y="235" width="404" height="275" rx="22" fill="#17334b" stroke="#3d5c70" stroke-width="2"/>
<rect x="516" y="235" width="404" height="8" rx="4" fill="#92bee8"/>
<text x="546" y="282" class="label">P0–P3  /  FORENSIC INVESTIGATION</text>
<text x="546" y="352" class="cardhead">A structural blind spot</text>
<text x="546" y="394" class="body">For 20 equal-free-flow swaps,</text>
<text x="546" y="427" class="body">predicted externality mirrored</text>
<text x="546" y="460" class="body">predicted own-driver cost.</text>
